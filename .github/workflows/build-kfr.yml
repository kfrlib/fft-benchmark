name: Build KFR Binaries
on: push
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Packages
        run: |
          sudo apt-get update && sudo apt-get install -y wget cmake ninja-build build-essential unzip libomp-dev clang
      - name: Clone KFR
        run: |
          git clone --branch dev --depth 1 https://github.com/kfrlib/kfr.git ${{ runner.temp }}/kfr
      - name: Build benchmark
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja "-DKFR_SRC_DIR=${{ runner.temp }}/kfr" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DSINGLE=kfr -DVCPKG_MANIFEST_INSTALL=OFF
          ninja -C build
          ls -la build
          file build/fft_benchmark_*
          mkdir -p "${{ github.workspace }}/dist/licenses"
          cp build/fft_benchmark_* "${{ github.workspace }}/dist"
          cp build/src_benchmark_* "${{ github.workspace }}/dist"
          cp "${{ runner.temp }}/kfr/LICENSE.txt" "${{ github.workspace }}/dist/licenses/KFR.txt"
      - name: Verify benchmarks
        # NOTE: The printed performance numbers are not meaningful here.
        # CI runners are virtualized and subject to significant timing noise.
        # This step only verifies that the compiled binaries start and run without errors.
        run: |
          echo "NOTE: Performance numbers below are not meaningful - CI runners are virtualized and subject to significant timing noise. This step only verifies that the compiled binaries start and run without errors."
          for bin in build/fft_benchmark_*; do
            case "$bin" in *-avx512*) echo "=== SKIP $bin (AVX-512 not supported on CI) ==="; continue ;; esac
            echo "=== $bin ==="
            "$bin"  --accuracy --no-banner --complex y --inverse n --inplace n 4096
          done
      - name: Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-kfrng
          path: ${{ github.workspace }}/dist

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Packages
        run: |
          sudo apt-get update && sudo apt-get install -y wget cmake ninja-build build-essential unzip libomp-dev clang
      - name: Clone KFR
        run: |
          git clone --branch dev --depth 1 https://github.com/kfrlib/kfr.git ${{ runner.temp }}/kfr
      - name: Build benchmark
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja "-DKFR_SRC_DIR=${{ runner.temp }}/kfr" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DSINGLE=kfr -DVCPKG_MANIFEST_INSTALL=OFF
          ninja -C build
          ls -la build
          file build/fft_benchmark_*
          mkdir -p "${{ github.workspace }}/dist/licenses"
          cp build/fft_benchmark_* "${{ github.workspace }}/dist"
          cp build/src_benchmark_* "${{ github.workspace }}/dist"
          cp "${{ runner.temp }}/kfr/LICENSE.txt" "${{ github.workspace }}/dist/licenses/KFR.txt"
      - name: Verify benchmarks
        # NOTE: The printed performance numbers are not meaningful here.
        # CI runners are virtualized and subject to significant timing noise.
        # This step only verifies that the compiled binaries start and run without errors.
        run: |
          echo "NOTE: Performance numbers below are not meaningful - CI runners are virtualized and subject to significant timing noise. This step only verifies that the compiled binaries start and run without errors."
          for bin in build/fft_benchmark_*; do
            echo "=== $bin ==="
            "$bin"  --accuracy --no-banner --complex y --inverse n --inplace n 4096
          done
      - name: Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-kfrng
          path: ${{ github.workspace }}/dist

  macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Packages
        run: |
          brew install cmake ninja libomp
      - name: Clone KFR
        run: |
          git clone --branch dev --depth 1 https://github.com/kfrlib/kfr.git ${{ runner.temp }}/kfr
      - name: Build benchmark
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja "-DKFR_SRC_DIR=${{ runner.temp }}/kfr" -DSINGLE=kfr -DVCPKG_MANIFEST_INSTALL=OFF
          ninja -C build
          ls -la build
          file build/fft_benchmark_*
          mkdir -p "${{ github.workspace }}/dist/licenses"
          cp build/fft_benchmark_* "${{ github.workspace }}/dist"
          cp build/src_benchmark_* "${{ github.workspace }}/dist"
          cp "${{ runner.temp }}/kfr/LICENSE.txt" "${{ github.workspace }}/dist/licenses/KFR.txt"
      - name: Verify benchmarks
        # NOTE: The printed performance numbers are not meaningful here.
        # CI runners are virtualized and subject to significant timing noise.
        # This step only verifies that the compiled binaries start and run without errors.
        run: |
          echo "NOTE: Performance numbers below are not meaningful - CI runners are virtualized and subject to significant timing noise. This step only verifies that the compiled binaries start and run without errors."
          for bin in build/fft_benchmark_*; do
            echo "=== $bin ==="
            "$bin"  --accuracy --no-banner --complex y --inverse n --inplace n 4096
          done
      - name: Binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-kfrng
          path: ${{ github.workspace }}/dist

  windows-x86_64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Clone KFR
        run: |
          git clone --branch dev --depth 1 https://github.com/kfrlib/kfr.git ${{ runner.temp }}\kfr
      - name: Build benchmark
        run: |
          & 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1' -Arch amd64 -HostArch amd64
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja "-DKFR_SRC_DIR=${{ runner.temp }}\kfr" -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" -DCMAKE_LINKER="C:/Program Files/LLVM/bin/lld-link.exe" -DSINGLE=kfr -DVCPKG_MANIFEST_INSTALL=OFF
          ninja -C build
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\dist\licenses"
          Copy-Item build\fft_benchmark_*.exe "${{ github.workspace }}\dist"
          Copy-Item build\src_benchmark_*.exe "${{ github.workspace }}\dist"
          Copy-Item "${{ runner.temp }}\kfr\LICENSE.txt" "${{ github.workspace }}\dist\licenses\KFR.txt"
      - name: Verify benchmarks
        # NOTE: The printed performance numbers are not meaningful here.
        # CI runners are virtualized and subject to significant timing noise.
        # This step only verifies that the compiled binaries start and run without errors.
        run: |
          Write-Host "NOTE: Performance numbers below are not meaningful - CI runners are virtualized and subject to significant timing noise. This step only verifies that the compiled binaries start and run without errors."
          Get-ChildItem build\fft_benchmark_*.exe | ForEach-Object {
            if ($_.Name -like "*-avx512*") { Write-Host "=== SKIP $($_.Name) (AVX-512 not supported on CI) ==="; return }
            Write-Host "=== $($_.Name) ==="
            & $_.FullName  --accuracy --no-banner --complex y --inverse n --inplace n 4096
          }
      - name: Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-kfrng
          path: ${{ github.workspace }}/dist
