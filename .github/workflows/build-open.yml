name: Build
on: push
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    env:
      VCPKG_FEATURE_FLAGS: manifests
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-bincache-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-bincache-
      - name: Ensure vcpkg cache directory
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Packages
        run: |
          sudo apt-get update && sudo apt-get install -y wget cmake gnupg2 ninja-build build-essential unzip libx11-dev libxcomposite-dev libxext-dev libasound2-dev libfontconfig1-dev libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev libomp-dev clang
      - name: Bootstrap local vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Get KFR7 binaries
        env:
          TMP_DIR: ${{ runner.temp }}
          KFR_VER: 7.0.1
        run: |
          curl -o "$TMP_DIR/kfr.zip" -L "https://github.com/kfrlib/kfr/releases/download/$KFR_VER/kfr-linux-x86_64.zip"
          unzip "$TMP_DIR/kfr.zip" -d "${TMP_DIR}/kfr"
          ls -la "${TMP_DIR}/kfr/kfr-linux-x86_64"
      - name: Build benchmark
        env:
          TMP_DIR: ${{ runner.temp }}
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja "-DCMAKE_PREFIX_PATH=${TMP_DIR}/kfr/kfr-linux-x86_64/lib/cmake;${{ github.workspace }}/vcpkg_installed/x64-linux/share" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DOPEN=ON
          ninja -C build
          ls -la build
          file build/fft_benchmark_*
          mkdir -p "${{ github.workspace }}/dist"
          cp build/fft_benchmark_* "${{ github.workspace }}/dist"
      - name: Verify benchmarks
        # NOTE: The printed performance numbers are not meaningful here.
        # CI runners are virtualized and subject to significant timing noise.
        # This step only verifies that the compiled binaries start and run without errors.
        run: |
          echo "NOTE: Performance numbers below are not meaningful - CI runners are virtualized and subject to significant timing noise. This step only verifies that the compiled binaries start and run without errors."
          for bin in build/fft_benchmark_*; do
            echo "=== $bin ==="
            "$bin" --no-banner --complex y --inverse n --inplace n 4096
          done
      - name: Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-open
          path: ${{ github.workspace }}/dist
      - name: Upload buildtrees
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-buildtrees-linux-x86_64
          retention-days: 10
          path: |
            ${{ github.workspace }}/vcpkg/buildtrees

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      VCPKG_FEATURE_FLAGS: manifests
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-bincache-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-bincache-
      - name: Ensure vcpkg cache directory
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Packages
        run: |
          sudo apt-get update && sudo apt-get install -y wget cmake gnupg2 ninja-build build-essential unzip libx11-dev libxcomposite-dev libxext-dev libasound2-dev libfontconfig1-dev libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev libomp-dev clang
      - name: Bootstrap local vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Get KFR7 binaries
        env:
          TMP_DIR: ${{ runner.temp }}
          KFR_VER: 7.0.1
        run: |
          curl -o "$TMP_DIR/kfr.zip" -L "https://github.com/kfrlib/kfr/releases/download/$KFR_VER/kfr-linux-arm64.zip"
          unzip "$TMP_DIR/kfr.zip" -d "${TMP_DIR}/kfr"
          ls -la "${TMP_DIR}/kfr/kfr-linux-arm64"
      - name: Build benchmark
        env:
          TMP_DIR: ${{ runner.temp }}
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja "-DCMAKE_PREFIX_PATH=${TMP_DIR}/kfr/kfr-linux-arm64/lib/cmake;${{ github.workspace }}/vcpkg_installed/arm64-linux/share" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DVCPKG_TARGET_TRIPLET=arm64-linux -DVCPKG_HOST_TRIPLET=arm64-linux -DOPEN=ON
          ninja -C build
          ls -la build
          file build/fft_benchmark_*
          mkdir -p "${{ github.workspace }}/dist"
          cp build/fft_benchmark_* "${{ github.workspace }}/dist"
      - name: Verify benchmarks
        # NOTE: The printed performance numbers are not meaningful here.
        # CI runners are virtualized and subject to significant timing noise.
        # This step only verifies that the compiled binaries start and run without errors.
        run: |
          echo "NOTE: Performance numbers below are not meaningful - CI runners are virtualized and subject to significant timing noise. This step only verifies that the compiled binaries start and run without errors."
          for bin in build/fft_benchmark_*; do
            echo "=== $bin ==="
            "$bin" --no-banner --complex y --inverse n --inplace n 4096
          done
      - name: Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-open
          path: ${{ github.workspace }}/dist
      - name: Upload buildtrees
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-buildtrees-linux-arm64
          retention-days: 10
          path: |
            ${{ github.workspace }}/vcpkg/buildtrees

  macos-arm64:
    runs-on: macos-14
    env:
      VCPKG_FEATURE_FLAGS: manifests
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-bincache-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-bincache-
      - name: Ensure vcpkg cache directory
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Packages
        run: |
          brew install cmake ninja libomp
      - name: Bootstrap local vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Get KFR7 binaries
        env:
          TMP_DIR: ${{ runner.temp }}
          KFR_VER: 7.0.1
        run: |
          curl -o "$TMP_DIR/kfr.zip" -L "https://github.com/kfrlib/kfr/releases/download/$KFR_VER/kfr-macos-arm64.zip"
          unzip "$TMP_DIR/kfr.zip" -d "${TMP_DIR}/kfr"
          ls -la "${TMP_DIR}/kfr/kfr-macos-arm64"
      - name: Build benchmark
        env:
          TMP_DIR: ${{ runner.temp }}
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja "-DCMAKE_PREFIX_PATH=${TMP_DIR}/kfr/kfr-macos-arm64/lib/cmake;${{ github.workspace }}/vcpkg_installed/arm64-osx/share" -DOPEN=ON
          ninja -C build
          ls -la build
          file build/fft_benchmark_*
          mkdir -p "${{ github.workspace }}/dist"
          cp build/fft_benchmark_* "${{ github.workspace }}/dist"
      - name: Verify benchmarks
        # NOTE: The printed performance numbers are not meaningful here.
        # CI runners are virtualized and subject to significant timing noise.
        # This step only verifies that the compiled binaries start and run without errors.
        run: |
          echo "NOTE: Performance numbers below are not meaningful - CI runners are virtualized and subject to significant timing noise. This step only verifies that the compiled binaries start and run without errors."
          for bin in build/fft_benchmark_*; do
            echo "=== $bin ==="
            "$bin" --no-banner --complex y --inverse n --inplace n 4096
          done
      - name: Binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-open
          path: ${{ github.workspace }}/dist
      - name: Upload buildtrees
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-buildtrees-macos-arm64
          retention-days: 10
          path: |
            ${{ github.workspace }}/vcpkg/buildtrees

  windows-x86_64:
    runs-on: windows-latest
    env:
      VCPKG_FEATURE_FLAGS: manifests
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-bincache-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-bincache-
      - name: Ensure vcpkg cache directory
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE"
      - name: Bootstrap local vcpkg
        run: |
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Get KFR7 binaries
        env:
          TMP_DIR: ${{ runner.temp }}
          KFR_VER: 7.0.1
        run: |
          curl.exe -o "$env:TMP_DIR\kfr.zip" -L "https://github.com/kfrlib/kfr/releases/download/$env:KFR_VER/kfr-windows-x86_64.zip"
          Expand-Archive -Path "$env:TMP_DIR\kfr.zip" -DestinationPath "$env:TMP_DIR\kfr"
      - name: Build benchmark
        env:
          TMP_DIR: ${{ runner.temp }}
        run: |
          ls "$env:VCPKG_DEFAULT_BINARY_CACHE"
          & 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1' -Arch amd64 -HostArch amd64
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -GNinja "-DCMAKE_PREFIX_PATH=$env:TMP_DIR/kfr/kfr-windows-x86_64/lib/cmake;${{ github.workspace }}/vcpkg_installed/x64-windows-static-md/share" -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" -DCMAKE_LINKER="C:/Program Files/LLVM/bin/lld-link.exe" -DOPEN=ON
          ninja -C build
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\dist"
          Copy-Item build\fft_benchmark_*.exe "${{ github.workspace }}\dist"
      - name: Verify benchmarks
        # NOTE: The printed performance numbers are not meaningful here.
        # CI runners are virtualized and subject to significant timing noise.
        # This step only verifies that the compiled binaries start and run without errors.
        run: |
          Write-Host "NOTE: Performance numbers below are not meaningful - CI runners are virtualized and subject to significant timing noise. This step only verifies that the compiled binaries start and run without errors."
          Get-ChildItem build\fft_benchmark_*.exe | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            & $_.FullName --no-banner --complex y --inverse n --inplace n 4096
          }
      - name: Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-open
          path: ${{ github.workspace }}/dist
      - name: Upload buildtrees
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-buildtrees-windows-x86_64
          retention-days: 10
          path: |
            ${{ github.workspace }}\vcpkg\buildtrees
